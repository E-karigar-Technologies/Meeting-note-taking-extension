<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Note Taker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <div class="header-content">
      <div class="header-left">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
        <div>
          <div class="header-title">Meeting Note Taker</div>
          <div class="header-subtitle">Record • Transcribe • Summarize</div>
        </div>
      </div>
      <button class="settings-btn" id="btnSettings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══ MAIN CONTENT ═══ -->
  <div class="main-content">

    <!-- ── LAUNCHER (default view) ── -->
    <div class="section active" id="sectionLauncher">
      <div class="idle-hero">
        <div class="idle-illustration">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
        <h1 class="idle-title">Ready to Record</h1>
        <p class="idle-subtitle">Capture your meeting with screen recording, system audio, and microphone. Get AI-powered transcriptions and summaries.</p>
        <button class="btn-primary" id="btnOpenRecorder">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
          <span>Start Recording</span>
        </button>
      </div>
    </div>

    <!-- ── SETTINGS PANEL ── -->
    <div class="settings-panel" id="settingsPanel">
      <button class="settings-back" id="btnSettingsBack">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <h2 class="settings-title">API Settings</h2>
      <p class="settings-subtitle">Enter your API keys to enable transcription and summarization.</p>

      <div class="settings-field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          Deepgram API Key
        </label>
        <input type="password" class="settings-input" id="inputDeepgramKey" placeholder="Enter your Deepgram API key">
      </div>

      <div class="settings-field">
        <label>
          <svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          OpenAI API Key
        </label>
        <input type="password" class="settings-input" id="inputOpenaiKey" placeholder="Enter your OpenAI API key">
      </div>

      <button class="settings-save" id="btnSaveSettings">Save Settings</button>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
